<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mergington High School Activities - Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    header {
      text-align: center;
      padding: 20px 0;
      margin-bottom: 30px;
      background-color: #1a237e;
      color: white;
      border-radius: 5px;
    }

    header h1 {
      margin-bottom: 10px;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    section {
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    section h3 {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
      color: #1a237e;
    }

    .activity-card {
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
    }

    .activity-card h4 {
      margin-bottom: 10px;
      color: #0066cc;
    }

    .activity-card p {
      margin-bottom: 8px;
    }

    .participants-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #e0e0e0;
    }

    .participants-section strong {
      color: #1a237e;
      display: block;
      margin-bottom: 10px;
    }

    .participants-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .participants-list li {
      padding: 6px 0;
      position: relative;
      color: #555;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .participants-list li:before {
      display: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #c62828;
      font-size: 18px;
      cursor: pointer;
      padding: 0 8px;
      transition: color 0.2s, transform 0.2s;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #d32f2f;
      transform: scale(1.2);
    }

    .participants-list li em {
      color: #999;
      font-style: italic;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }

    button[type="submit"] {
      background-color: #1a237e;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }

    button[type="submit"]:hover {
      background-color: #3949ab;
    }

    .message {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
    }

    .success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #666;
    }

    .demo-note {
      background-color: #fff3e0;
      border-left: 4px solid #ff9800;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      color: #e65100;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mergington High School</h1>
    <h2>Extracurricular Activities</h2>
  </header>

  <main>
    <section id="activities-container">
      <div class="demo-note">
        <strong>✨ Demo Preview:</strong> Click the ✕ icon to remove participants from activities!
      </div>
      <h3>Available Activities</h3>
      <div id="activities-list">
        <!-- Activities will be loaded here -->
      </div>
    </section>

    <section id="signup-container">
      <h3>Sign Up for an Activity</h3>
      <form id="signup-form">
        <div class="form-group">
          <label for="email">Student Email:</label>
          <input type="email" id="email" required placeholder="your-email@mergington.edu" />
        </div>
        <div class="form-group">
          <label for="activity">Select Activity:</label>
          <select id="activity" required>
            <option value="">-- Select an activity --</option>
          </select>
        </div>
        <button type="submit">Sign Up</button>
      </form>
      <div id="message" class="hidden"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Mergington High School</p>
  </footer>

  <script>
    // Mock activities data (same as in the backend)
    const activities = {
      "Chess Club": {
        "description": "Learn strategies and compete in chess tournaments",
        "schedule": "Fridays, 3:30 PM - 5:00 PM",
        "max_participants": 12,
        "participants": ["michael@mergington.edu", "daniel@mergington.edu"]
      },
      "Programming Class": {
        "description": "Learn programming fundamentals and build software projects",
        "schedule": "Tuesdays and Thursdays, 3:30 PM - 4:30 PM",
        "max_participants": 20,
        "participants": ["emma@mergington.edu", "sophia@mergington.edu"]
      },
      "Gym Class": {
        "description": "Physical education and sports activities",
        "schedule": "Mondays, Wednesdays, Fridays, 2:00 PM - 3:00 PM",
        "max_participants": 30,
        "participants": ["john@mergington.edu", "olivia@mergington.edu"]
      },
      "Soccer Team": {
        "description": "Practice soccer skills and compete in team matches",
        "schedule": "Tuesdays and Thursdays, 3:30 PM - 5:00 PM",
        "max_participants": 22,
        "participants": []
      },
      "Basketball Club": {
        "description": "Develop basketball skills and play friendly games",
        "schedule": "Mondays and Wednesdays, 3:30 PM - 5:00 PM",
        "max_participants": 15,
        "participants": []
      }
    };

    function renderActivities() {
      const activitiesList = document.getElementById("activities-list");
      const activitySelect = document.getElementById("activity");
      
      activitiesList.innerHTML = "";
      activitySelect.innerHTML = '<option value="">-- Select an activity --</option>';

      Object.entries(activities).forEach(([name, details]) => {
        const activityCard = document.createElement("div");
        activityCard.className = "activity-card";

        const spotsLeft = details.max_participants - details.participants.length;

        const participantsList = details.participants.length > 0 
          ? details.participants.map(p => `<li>${p} <button class="delete-btn" data-activity="${name}" data-email="${p}" aria-label="Remove ${p}">✕</button></li>`).join('')
          : '<li><em>No participants yet</em></li>';

        activityCard.innerHTML = `
          <h4>${name}</h4>
          <p>${details.description}</p>
          <p><strong>Schedule:</strong> ${details.schedule}</p>
          <p><strong>Availability:</strong> ${spotsLeft} spots left</p>
          <div class="participants-section">
            <strong>Participants:</strong>
            <ul class="participants-list">
              ${participantsList}
            </ul>
          </div>
        `;

        activitiesList.appendChild(activityCard);

        // Add option to select dropdown
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        activitySelect.appendChild(option);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const signupForm = document.getElementById("signup-form");
      const messageDiv = document.getElementById("message");

      renderActivities();

      // Handle form submission
      signupForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const activity = document.getElementById("activity").value;

        const activityData = activities[activity];
        
        if (!activityData) {
          messageDiv.textContent = "Please select a valid activity";
          messageDiv.className = "error";
        } else if (activityData.participants.includes(email)) {
          messageDiv.textContent = `${email} is already signed up for ${activity}`;
          messageDiv.className = "error";
        } else if (activityData.participants.length >= activityData.max_participants) {
          messageDiv.textContent = `${activity} is full`;
          messageDiv.className = "error";
        } else {
          activityData.participants.push(email);
          messageDiv.textContent = `Successfully signed up ${email} for ${activity}!`;
          messageDiv.className = "success";
          signupForm.reset();
          
          // Refresh the activities list
          setTimeout(() => {
            renderActivities();
          }, 500);
        }

        messageDiv.classList.remove("hidden");

        // Hide message after 5 seconds
        setTimeout(() => {
          messageDiv.classList.add("hidden");
        }, 5000);
      });

      // Handle participant deletion
      document.addEventListener("click", (event) => {
        if (event.target.classList.contains("delete-btn")) {
          const activity = event.target.dataset.activity;
          const email = event.target.dataset.email;

          if (confirm(`Remove ${email} from ${activity}?`)) {
            const activityData = activities[activity];
            const index = activityData.participants.indexOf(email);
            if (index > -1) {
              activityData.participants.splice(index, 1);
              renderActivities();
            }
          }
        }
      });
    });
  </script>
</body>
</html>
